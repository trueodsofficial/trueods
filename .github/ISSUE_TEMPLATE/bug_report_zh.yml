name: 故障反馈
description: 报告渲染失败、画面异常或其他意外行为。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请用中文或英文填写。日志、原图和工程材料请私下发至 **trueodssupport@gmail.com**；不要在公开 Issue 中粘贴私密路径、客户资料或凭据。
  - type: dropdown
    id: edition
    attributes:
      label: 产品版本
      options:
        - TrueODS 基础版
        - TrueODS Distributed 分布式渲染版
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      description: 填写 TrueODS.uplugin 中的 VersionName 和 Version。
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: 引擎版本
      description: 完整 UE 版本号，以及 Launcher 安装或源码编译。
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: 运行环境
      description: Windows 版本、显卡型号、显存容量、当前驱动版本。
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: 出现问题的流程
      options:
        - 新任务（单机）
        - 续渲（单机）
        - 多机协同渲染（分布式渲染版）
        - 其他
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: 渲染设置与帧范围
      description: 渲染器、每眼分辨率、采样、显存模式、输出格式和帧范围；续渲或多机问题请注明接点帧号及机器数。
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: 实际结果、预期结果与复现步骤
      description: 简述如何触发、是否每次出现，以及单帧或短序列是否也能复现。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 未附日志、原图、工程材料或其他私密信息。
          required: true
