name: 故障反馈 / Bug report
description: 报告渲染失败、画面异常或其他意外行为。 / Report a render failure, visual defect or unexpected behaviour.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请用中文或英文填写。日志、原图和工程材料请私下发至 **trueodssupport@gmail.com**；不要在公开 Issue 中粘贴私密路径、客户资料或凭据。
        Write in Chinese or English. Send logs, original frames and project materials privately to **trueodssupport@gmail.com**; keep private paths, client materials and credentials out of public issues.
  - type: dropdown
    id: edition
    attributes:
      label: 产品版本 / Product edition
      options:
        - TrueODS 基础版 / TrueODS (base edition)
        - TrueODS Distributed 分布式渲染版 / TrueODS Distributed
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: 插件版本 / Plugin version
      description: 填写 TrueODS.uplugin 中的 VersionName 和 Version。 / Copy VersionName and Version from TrueODS.uplugin.
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: 引擎版本 / Engine version
      description: 完整 UE 版本号，以及 Launcher 安装或源码编译。 / Include the exact UE patch version and whether it is a Launcher or source build.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: 运行环境 / Hardware and system
      description: Windows 版本、显卡型号、显存容量、当前驱动版本。 / Windows version, GPU, VRAM capacity and current driver version.
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: 出现问题的流程 / Affected workflow
      options:
        - 新任务（单机） / New render (one machine)
        - 续渲（单机） / Resumed render (one machine)
        - 多机协同渲染（分布式渲染版） / Multi-Machine Rendering (TrueODS Distributed)
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: 渲染设置与帧范围 / Render settings and frame range
      description: 渲染器、每眼分辨率、采样、显存模式、输出格式和帧范围；续渲或多机问题请注明接点帧号及机器数。 / Include renderer, per-eye resolution, sampling, VRAM mode, output format and frame range; for resumed or multi-machine renders, add the join frame and machine count.
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: 实际结果、预期结果与复现步骤 / Actual result, expected result and reproduction steps
      description: 简述如何触发、是否每次出现，以及单帧或短序列是否也能复现。 / Briefly describe the steps, how often it occurs and whether a single frame or short sequence reproduces it.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查 / Public-content check
      options:
        - label: 未附日志、原图、工程材料或其他私密信息。 / I have not attached logs, original frames, project materials or other private information.
          required: true
