name: Bug report
description: Report a render failure, visual defect or unexpected behaviour.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Write in Chinese or English. Send logs, original frames and project materials privately to **trueodssupport@gmail.com**; keep private paths, client materials and credentials out of public issues.
  - type: dropdown
    id: edition
    attributes:
      label: Product edition
      options:
        - TrueODS (base edition)
        - TrueODS Distributed
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: Copy VersionName and Version from TrueODS.uplugin.
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine version
      description: Include the exact UE patch version and whether it is a Launcher or source build.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware and system
      description: Windows version, GPU, VRAM capacity and current driver version.
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Affected workflow
      options:
        - New render (one machine)
        - Resumed render (one machine)
        - Multi-Machine Rendering (TrueODS Distributed)
        - Other
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Render settings and frame range
      description: Include renderer, per-eye resolution, sampling, VRAM mode, output format and frame range; for resumed or multi-machine renders, add the join frame and machine count.
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: Actual result, expected result and reproduction steps
      description: Briefly describe the steps, how often it occurs and whether a single frame or short sequence reproduces it.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-content check
      options:
        - label: I have not attached logs, original frames, project materials or other private information.
          required: true
